name: Keep Supabase Alive

on:
  schedule:
    # Se ejecuta cada 6 días a medianoche
    - cron: '0 0 */6 * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Table
        run: |
          # Realiza el ping y guarda el resultado
          RESPONSE=$(curl -s -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/categories?limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          
          # Imprime un mensaje claro en los logs de GitHub
          echo "Supabase respondió: $RESPONSE"
          echo "Ping ejecutado con éxito en $(date)"
